<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMPLE DODGE</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }

        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            background: #222;
            border: 2px solid #555;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        canvas {
            display: block;
            background: #1a1a1a;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 10;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        p {
            font-size: 14px;
            line-height: 1.6;
            color: #ccc;
            padding: 0 20px;
            margin-bottom: 25px;
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(76, 175, 80, 0.4);
        }

        button:hover {
            background: #45a049;
            transform: translateY(-2px);
        }

        #score-display {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 18px;
            font-weight: bold;
            z-index: 5;
            text-shadow: 1px 1px 2px #000;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- スコア表示 -->
        <div id="score-display">SCORE: 0</div>

        <!-- ゲーム画面（Canvas） -->
        <canvas id="gameCanvas" width="400" height="600"></canvas>

        <!-- スタート画面 -->
        <div id="start-screen" class="overlay">
            <h1>SIMPLE DODGE</h1>
            <p>赤ブロックを避けてコインを取ろう！<br><br>【操作】<br>PC: ◀ / ▶ キー<br>スマホ: 画面の左右をタップ</p>
            <button onclick="startGame()">ゲームスタート</button>
        </div>

        <!-- ゲームオーバー画面 -->
        <div id="gameover-screen" class="overlay" style="display: none;">
            <h1 style="color: #ff4444;">GAME OVER</h1>
            <p id="score-text">SCORE: 0</p>
            <button onclick="startGame()">もう一度プレイ</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const startScreen = document.getElementById('start-screen');
        const gameoverScreen = document.getElementById('gameover-screen');
        const scoreText = document.getElementById('score-text');
        const scoreDisplay = document.getElementById('score-display');

        // ゲーム変数
        let score = 0;
        let isPlaying = false;
        let animationId;

        // プレイヤー
        const player = {
            x: 175,
            y: 520,
            width: 50,
            height: 20,
            speed: 7,
            dx: 0
        };

        // 障害物・アイテムの配列
        let obstacles = [];
        let coins = [];
        let frameCount = 0;

        // キー入力管理
        const keys = {
            ArrowLeft: false,
            ArrowRight: false
        };

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                keys[e.key] = true;
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                keys[e.key] = false;
            }
        });

        // スマホタッチ操作
        canvas.addEventListener('touchstart', (e) => {
            if (!isPlaying) return;
            const touchX = e.touches[0].clientX;
            const canvasRect = canvas.getBoundingClientRect();
            const clickX = touchX - canvasRect.left;

            if (clickX < canvas.width / 2) {
                player.x -= 30;
            } else {
                player.x += 30;
            }
            // 画面外に出ないように制限
            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
        });

        function startGame() {
            startScreen.style.display = 'none';
            gameoverScreen.style.display = 'none';
            
            // 変数の初期化
            score = 0;
            obstacles = [];
            coins = [];
            frameCount = 0;
            player.x = 175;
            scoreDisplay.textContent = 'SCORE: 0';
            
            isPlaying = true;
            loop();
        }

        function gameOver() {
            isPlaying = false;
            cancelAnimationFrame(animationId);
            scoreText.textContent = `SCORE: ${score}`;
            gameoverScreen.style.display = 'flex';
        }

        // 当たり判定関数
        function checkCollision(rect1, rect2) {
            return (
                rect1.x < rect2.x + rect2.width &&
                rect1.x + rect1.width > rect2.x &&
                rect1.y < rect2.y + rect2.height &&
                rect1.y + rect1.height > rect2.y
            );
        }

        function update() {
            frameCount++;

            // プレイヤーの移動 (PC)
            if (keys.ArrowLeft) player.x -= player.speed;
            if (keys.ArrowRight) player.x += player.speed;

            // 画面端の制限
            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;

            // 障害物（赤ブロック）の生成
            if (frameCount % 45 === 0) {
                obstacles.push({
                    x: Math.random() * (canvas.width - 30),
                    y: -30,
                    width: 30,
                    height: 30,
                    speed: 4 + Math.random() * 3
                });
            }

            // コインの生成
            if (frameCount % 70 === 0) {
                coins.push({
                    x: Math.random() * (canvas.width - 20),
                    y: -20,
                    width: 20,
                    height: 20,
                    speed: 3.5
                });
            }

            // 障害物の更新
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].y += obstacles[i].speed;

                // プレイヤーとの当たり判定
                if (checkCollision(player, obstacles[i])) {
                    gameOver();
                    return;
                }

                // 画面外に出たら削除
                if (obstacles[i].y > canvas.height) {
                    obstacles.splice(i, 1);
                    score += 5; // 避けたら加点
                }
            }

            // コインの更新
            for (let i = coins.length - 1; i >= 0; i--) {
                coins[i].y += coins[i].speed;

                // プレイヤーとの当たり判定
                if (checkCollision(player, coins[i])) {
                    score += 50; // コインを取ったら大きく加点
                    coins.splice(i, 1);
                    continue;
                }

                // 画面外に出たら削除
                if (coins[i].y > canvas.height) {
                    coins.splice(i, 1);
                }
            }

            // スコア表示更新
            scoreDisplay.textContent = `SCORE: ${score}`;
        }

        function draw() {
            // 画面クリア
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // プレイヤーを描画 (青いバー)
            ctx.fillStyle = '#00bcd4';
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // 障害物を描画 (赤いブロック)
            ctx.fillStyle = '#ff4444';
            obstacles.forEach(obs => {
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            });

            // コインを描画 (黄色の円)
            ctx.fillStyle = '#ffeb3b';
            coins.forEach(coin => {
                ctx.beginPath();
                ctx.arc(coin.x + coin.width / 2, coin.y + coin.height / 2, coin.width / 2, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function loop() {
            if (!isPlaying) return;
            update();
            draw();
            animationId = requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
